<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CHAPPIE</title>
  <style>
    :root {
      --bg: #0b0d12;
      --panel: #141821;
      --panel-2: #1c2230;
      --text: #e6e9ef;
      --muted: #8b93a7;
      --accent: #6c8eff;
      --accent-2: #8a6cff;
      --user: #2a3450;
      --bot: #1a2030;
      --ok: #4ade80;
      --bad: #f87171;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(1200px 800px at 70% -10%, #1b2240 0%, var(--bg) 60%);
      color: var(--text);
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 16px 24px;
      border-bottom: 1px solid #1f2535;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    header .logo {
      width: 32px; height: 32px; border-radius: 8px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      display: grid; place-items: center; font-weight: 700;
    }
    header .title { font-weight: 600; letter-spacing: 0.3px; }
    header .status {
      margin-left: auto;
      display: flex; align-items: center; gap: 8px;
      color: var(--muted); font-size: 12px;
    }
    header .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--bad);
      box-shadow: 0 0 8px currentColor;
    }
    header .dot.ok { background: var(--ok); }

    main {
      flex: 1; display: flex; min-height: 0;
      padding: 16px; gap: 16px;
    }
    .chat {
      flex: 1; display: flex; flex-direction: column;
      background: var(--panel);
      border: 1px solid #1f2535;
      border-radius: 14px;
      min-width: 0;
    }
    .messages {
      flex: 1; overflow-y: auto;
      padding: 16px;
      display: flex; flex-direction: column; gap: 10px;
    }
    .msg { max-width: 78%; padding: 10px 14px; border-radius: 12px; line-height: 1.45; white-space: pre-wrap; word-wrap: break-word; }
    .msg.user { align-self: flex-end; background: var(--user); border-bottom-right-radius: 4px; }
    .msg.bot  { align-self: flex-start; background: var(--bot);  border-bottom-left-radius: 4px; }
    .msg .who { font-size: 11px; color: var(--muted); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.6px; }

    .input {
      padding: 12px;
      border-top: 1px solid #1f2535;
      display: flex; gap: 8px;
    }
    .input textarea {
      flex: 1; resize: none; border-radius: 10px;
      border: 1px solid #2a3045; background: var(--panel-2); color: var(--text);
      padding: 10px 12px; font-size: 14px; font-family: inherit;
      min-height: 44px; max-height: 160px;
      outline: none;
    }
    .input textarea:focus { border-color: var(--accent); }
    .input button {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: white; border: 0; border-radius: 10px;
      padding: 0 18px; font-weight: 600; cursor: pointer;
      transition: filter 0.15s;
    }
    .input button:hover { filter: brightness(1.08); }
    .input button:disabled { opacity: 0.5; cursor: not-allowed; }

    aside {
      width: 320px; min-width: 280px;
      background: var(--panel);
      border: 1px solid #1f2535;
      border-radius: 14px;
      padding: 16px;
      overflow-y: auto;
    }
    aside h3 { margin: 0 0 8px; font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.8px; }
    aside .card { background: var(--panel-2); border-radius: 10px; padding: 10px 12px; margin-bottom: 12px; font-size: 13px; }
    aside .card .row { display: flex; justify-content: space-between; padding: 3px 0; }
    aside .card .row span:last-child { color: var(--muted); }
    aside .empty { color: var(--muted); font-size: 12px; }

    @media (max-width: 820px) {
      aside { display: none; }
      main { padding: 8px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">C</div>
    <div class="title">CHAPPIE</div>
    <div class="status">
      <span class="dot" id="statusDot"></span>
      <span id="statusText">connecting…</span>
    </div>
  </header>

  <main>
    <section class="chat">
      <div class="messages" id="messages"></div>
      <div class="input">
        <textarea id="input" placeholder="Try: remember my favorite editor is vscode" rows="1"></textarea>
        <button id="send">Send</button>
      </div>
    </section>

    <aside>
      <h3>Status</h3>
      <div class="card" id="statusCard">
        <div class="row"><span>Session</span><span id="sess">—</span></div>
        <div class="row"><span>Preferences</span><span id="prefCount">0</span></div>
        <div class="row"><span>Skills</span><span id="skillCount">0</span></div>
      </div>

      <h3>Preferences</h3>
      <div class="card" id="prefsCard"><div class="empty">None yet.</div></div>

      <h3>Frequent resources</h3>
      <div class="card" id="resCard"><div class="empty">None yet.</div></div>
    </aside>
  </main>

  <script>
    const messages = document.getElementById("messages");
    const input    = document.getElementById("input");
    const sendBtn  = document.getElementById("send");
    const dot      = document.getElementById("statusDot");
    const statusTx = document.getElementById("statusText");

    function addMessage(text, who) {
      const div = document.createElement("div");
      div.className = "msg " + who;
      const w = document.createElement("div");
      w.className = "who";
      w.textContent = who === "user" ? "you" : "chappie";
      const body = document.createElement("div");
      body.textContent = text;
      div.appendChild(w);
      div.appendChild(body);
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
    }

    let ws;
    function connect() {
      const proto = location.protocol === "https:" ? "wss" : "ws";
      ws = new WebSocket(`${proto}://${location.host}/ws`);

      ws.onopen = () => {
        dot.classList.add("ok");
        statusTx.textContent = "online";
      };
      ws.onclose = () => {
        dot.classList.remove("ok");
        statusTx.textContent = "offline — retrying…";
        setTimeout(connect, 1500);
      };
      ws.onmessage = (ev) => {
        try {
          const data = JSON.parse(ev.data);
          if (data.type === "response") {
            addMessage(data.text, "bot");
            if (data.audio) {
              try { new Audio("data:audio/wav;base64," + data.audio).play().catch(() => {}); } catch {}
            }
            refreshStatus();
          } else if (data.type === "error") {
            addMessage("error: " + data.message, "bot");
          }
        } catch (e) {
          console.error(e);
        }
      };
    }

    function send() {
      const text = input.value.trim();
      if (!text || !ws || ws.readyState !== 1) return;
      addMessage(text, "user");
      ws.send(JSON.stringify({ type: "text_input", text }));
      input.value = "";
      input.style.height = "44px";
    }

    sendBtn.addEventListener("click", send);
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
    });
    input.addEventListener("input", () => {
      input.style.height = "44px";
      input.style.height = Math.min(input.scrollHeight, 160) + "px";
    });

    async function refreshStatus() {
      try {
        const [s, k] = await Promise.all([
          fetch("/status").then((r) => r.json()),
          fetch("/knowledge").then((r) => r.json()),
        ]);
        document.getElementById("sess").textContent = (s.session_id || "").slice(0, 8);
        document.getElementById("prefCount").textContent = s.preferences_learned ?? 0;
        document.getElementById("skillCount").textContent = s.skills_learned ?? 0;

        const pref = document.getElementById("prefsCard");
        const entries = Object.entries(k.preferences || {});
        pref.innerHTML = entries.length
          ? entries.map(([key, val]) => `<div class="row"><span>${key}</span><span>${val}</span></div>`).join("")
          : `<div class="empty">None yet.</div>`;

        const res = document.getElementById("resCard");
        const list = (k.resources || []).slice(0, 5);
        res.innerHTML = list.length
          ? list.map((r) => `<div class="row"><span>${r.resource}</span><span>${r.access_count}x</span></div>`).join("")
          : `<div class="empty">None yet.</div>`;
      } catch {}
    }

    connect();
    refreshStatus();
    addMessage("Hi! I'm CHAPPIE. Try: 'remember my favorite editor is vscode' then 'what is my favorite editor'.", "bot");
  </script>
</body>
</html>
