<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CHAPPIE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet"
  />
  <style>
    :root {
      --bg-0: #05060d;
      --bg-1: #0c0e1f;
      --bg-2: #131630;
      --accent: #6c8eff;
      --accent-2: #8a6cff;
      --accent-3: #4fd1ff;
      --text: #e6e9ef;
      --muted: #6b7390;
      --danger: #ff6b8a;
      --ok: #4ade80;
      --glass: rgba(20, 24, 48, 0.55);
      --glass-border: rgba(108, 142, 255, 0.18);
    }

    * { box-sizing: border-box; }
    html, body {
      height: 100%;
      margin: 0;
      overflow: hidden;
    }
    body {
      font-family: "Space Grotesk", -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--text);
      background: var(--bg-0);
      position: relative;
    }

    /* Animated background ----------------------------------- */
    body::before, body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -2;
      pointer-events: none;
    }
    body::before {
      background:
        radial-gradient(800px 600px at 70% -10%, rgba(108, 142, 255, 0.18), transparent 60%),
        radial-gradient(700px 500px at 10% 100%, rgba(138, 108, 255, 0.16), transparent 60%),
        radial-gradient(900px 700px at 50% 50%, rgba(79, 209, 255, 0.06), transparent 70%),
        var(--bg-0);
    }
    body::after {
      background:
        repeating-linear-gradient(0deg, transparent 0px, transparent 39px, rgba(255,255,255,0.012) 40px),
        repeating-linear-gradient(90deg, transparent 0px, transparent 39px, rgba(255,255,255,0.012) 40px);
      mix-blend-mode: screen;
      animation: grid-drift 40s linear infinite;
    }
    @keyframes grid-drift {
      to { transform: translate(40px, 40px); }
    }

    /* App layout -------------------------------------------- */
    #app {
      position: relative;
      height: 100vh;
      width: 100vw;
      display: grid;
      grid-template-rows: auto 1fr auto;
    }

    header {
      padding: 22px 32px;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-logo {
      width: 36px; height: 36px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      display: grid; place-items: center;
      font-weight: 700;
      box-shadow: 0 0 20px rgba(108, 142, 255, 0.35);
    }
    .brand-name {
      font-weight: 600;
      letter-spacing: 4px;
      font-size: 15px;
    }
    .brand-sub {
      font-family: "JetBrains Mono", monospace;
      font-size: 11px;
      color: var(--muted);
      margin-left: 6px;
      letter-spacing: 1px;
    }
    .header-spacer { flex: 1; }
    .header-actions { display: flex; gap: 10px; }
    .icon-btn {
      width: 40px; height: 40px;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      color: var(--text);
      cursor: pointer;
      display: grid; place-items: center;
      transition: all 0.15s ease;
      backdrop-filter: blur(10px);
    }
    .icon-btn:hover {
      background: rgba(108, 142, 255, 0.15);
      border-color: rgba(108, 142, 255, 0.4);
      transform: translateY(-1px);
    }
    .icon-btn.active {
      background: rgba(108, 142, 255, 0.2);
      border-color: rgba(108, 142, 255, 0.5);
      box-shadow: 0 0 15px rgba(108, 142, 255, 0.3);
    }
    .icon-btn svg { width: 18px; height: 18px; }

    /* Connection indicator */
    .conn-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--danger);
      box-shadow: 0 0 10px currentColor;
      transition: background 0.3s;
    }
    .conn-dot.ok { background: var(--ok); }
    .conn-label {
      font-family: "JetBrains Mono", monospace;
      font-size: 10px;
      color: var(--muted);
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }
    .conn { display: flex; align-items: center; gap: 8px; padding: 0 12px; }

    /* Main canvas ------------------------------------------- */
    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 36px;
      padding: 16px;
      min-height: 0;
    }

    /* The orb ----------------------------------------------- */
    #orb-stage {
      position: relative;
      width: 380px;
      height: 380px;
      display: grid;
      place-items: center;
    }
    .orb {
      position: relative;
      width: 220px;
      height: 220px;
    }
    .orb-core {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background:
        radial-gradient(circle at 32% 30%,
          rgba(255, 255, 255, 0.85) 0%,
          rgba(108, 142, 255, 0.85) 18%,
          rgba(60, 80, 180, 0.7) 45%,
          rgba(40, 50, 120, 0.5) 70%,
          rgba(20, 25, 60, 0.3) 95%);
      box-shadow:
        0 0 80px rgba(108, 142, 255, 0.55),
        0 0 140px rgba(138, 108, 255, 0.3),
        inset 0 -30px 60px rgba(20, 30, 80, 0.6),
        inset 0 30px 60px rgba(255, 255, 255, 0.08);
      animation: orb-breathe 4s ease-in-out infinite;
    }
    @keyframes orb-breathe {
      0%, 100% { transform: scale(1); filter: brightness(1); }
      50%      { transform: scale(1.025); filter: brightness(1.08); }
    }

    .orb-ring {
      position: absolute;
      border-radius: 50%;
      border: 1px solid rgba(108, 142, 255, 0.35);
    }
    .ring-1 {
      inset: -40px;
      border-style: dashed;
      animation: spin-cw 22s linear infinite;
    }
    .ring-2 {
      inset: -75px;
      border-color: rgba(138, 108, 255, 0.18);
      animation: spin-ccw 36s linear infinite;
    }
    .ring-3 {
      inset: -110px;
      border-color: rgba(79, 209, 255, 0.12);
      animation: spin-cw 60s linear infinite;
    }
    @keyframes spin-cw  { to { transform: rotate(360deg); } }
    @keyframes spin-ccw { to { transform: rotate(-360deg); } }

    /* Particles around the orb */
    .orb-particle {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--accent-3);
      box-shadow: 0 0 10px currentColor;
      transform-origin: 0 0;
      opacity: 0.7;
    }

    /* State variants */
    .orb.listening .orb-core {
      animation: orb-listen 1.2s ease-in-out infinite;
    }
    @keyframes orb-listen {
      0%, 100% { transform: scale(1); box-shadow: 0 0 80px rgba(108, 142, 255, 0.6), 0 0 140px rgba(138, 108, 255, 0.35), inset 0 -30px 60px rgba(20, 30, 80, 0.6), inset 0 30px 60px rgba(255, 255, 255, 0.08); }
      50%      { transform: scale(1.06); box-shadow: 0 0 130px rgba(108, 142, 255, 0.85), 0 0 200px rgba(138, 108, 255, 0.5), inset 0 -30px 60px rgba(20, 30, 80, 0.6), inset 0 30px 60px rgba(255, 255, 255, 0.18); }
    }
    .orb.listening .ring-1 { animation-duration: 8s; border-color: rgba(108, 142, 255, 0.65); }
    .orb.listening .ring-2 { animation-duration: 14s; border-color: rgba(138, 108, 255, 0.4); }

    .orb.thinking .orb-core {
      animation: orb-think 1.6s ease-in-out infinite;
      background:
        radial-gradient(circle at 30% 30%,
          rgba(255, 255, 255, 0.85),
          rgba(138, 108, 255, 0.8) 22%,
          rgba(80, 60, 180, 0.6) 55%,
          rgba(30, 20, 80, 0.4) 90%);
    }
    @keyframes orb-think {
      0%, 100% { transform: scale(1) rotate(0); }
      30%      { transform: scale(0.96) rotate(-3deg); }
      70%      { transform: scale(1.02) rotate(3deg); }
    }
    .orb.thinking .ring-1 { animation-duration: 4s; border-color: rgba(138, 108, 255, 0.5); }
    .orb.thinking .ring-2 { animation-duration: 6s; border-color: rgba(138, 108, 255, 0.3); }

    .orb.speaking .orb-core {
      animation: orb-speak 0.7s ease-in-out infinite;
      background:
        radial-gradient(circle at 30% 30%,
          rgba(255, 255, 255, 0.95),
          rgba(79, 209, 255, 0.85) 22%,
          rgba(60, 130, 200, 0.6) 55%,
          rgba(20, 50, 100, 0.4) 90%);
    }
    @keyframes orb-speak {
      0%, 100% { transform: scale(1); box-shadow: 0 0 90px rgba(79, 209, 255, 0.65), 0 0 160px rgba(108, 142, 255, 0.45), inset 0 -30px 60px rgba(20, 30, 80, 0.6), inset 0 30px 60px rgba(255, 255, 255, 0.18); }
      50%      { transform: scale(1.08); box-shadow: 0 0 150px rgba(79, 209, 255, 0.95), 0 0 240px rgba(108, 142, 255, 0.7), inset 0 -30px 60px rgba(20, 30, 80, 0.6), inset 0 30px 60px rgba(255, 255, 255, 0.25); }
    }
    .orb.speaking .ring-1 { animation-duration: 3s; border-color: rgba(79, 209, 255, 0.6); }
    .orb.speaking .ring-2 { animation-duration: 5s; border-color: rgba(79, 209, 255, 0.4); }

    .orb.error .orb-core {
      background:
        radial-gradient(circle at 30% 30%,
          rgba(255, 200, 200, 0.85),
          rgba(255, 107, 138, 0.85) 22%,
          rgba(120, 30, 60, 0.6) 65%);
      animation: orb-error 0.6s ease-in-out;
    }
    @keyframes orb-error {
      0%, 100% { transform: scale(1); }
      25%      { transform: scale(1.05); }
      50%      { transform: scale(0.95); }
      75%      { transform: scale(1.02); }
    }

    .orb-clickable {
      cursor: pointer;
      transition: transform 0.2s;
    }
    .orb-clickable:hover { transform: scale(1.02); }
    .orb-clickable:active { transform: scale(0.98); }

    /* Status text below orb */
    .status-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      max-width: 720px;
      width: 100%;
      text-align: center;
      min-height: 110px;
    }
    .status-line {
      font-family: "JetBrains Mono", monospace;
      font-size: 11px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--muted);
      transition: color 0.3s;
    }
    .status-line.active { color: var(--accent-3); }
    .status-line.thinking { color: var(--accent-2); }
    .status-line.speaking { color: var(--accent); }
    .status-line.error { color: var(--danger); }

    .last-line {
      font-size: 18px;
      line-height: 1.5;
      color: var(--text);
      max-width: 640px;
      animation: fade-in 0.4s ease;
    }
    .user-line {
      font-size: 13px;
      color: var(--muted);
      max-width: 640px;
      font-style: italic;
    }
    @keyframes fade-in {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Input bar -------------------------------------------- */
    .input-bar {
      padding: 16px 32px 28px;
      display: flex;
      gap: 12px;
      align-items: center;
      max-width: 880px;
      width: 100%;
      margin: 0 auto;
    }
    .input-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 6px 6px 6px 18px;
      backdrop-filter: blur(14px);
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .input-wrap:focus-within {
      border-color: rgba(108, 142, 255, 0.55);
      box-shadow: 0 0 0 3px rgba(108, 142, 255, 0.12);
    }
    #textInput {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-family: inherit;
      font-size: 15px;
      padding: 12px 0;
    }
    #textInput::placeholder { color: var(--muted); }
    .send-btn {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: white;
      border: none;
      border-radius: 12px;
      padding: 10px 20px;
      font-family: inherit;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: filter 0.15s, transform 0.1s;
    }
    .send-btn:hover { filter: brightness(1.08); }
    .send-btn:active { transform: scale(0.97); }
    .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .mic-btn {
      width: 44px; height: 44px;
      border-radius: 12px;
      border: 1px solid var(--glass-border);
      background: var(--glass);
      color: var(--text);
      cursor: pointer;
      display: grid; place-items: center;
      transition: all 0.15s;
    }
    .mic-btn:hover {
      background: rgba(108, 142, 255, 0.18);
      border-color: rgba(108, 142, 255, 0.5);
    }
    .mic-btn.recording {
      background: rgba(255, 107, 138, 0.22);
      border-color: rgba(255, 107, 138, 0.6);
      color: var(--danger);
      animation: mic-pulse 1s ease-in-out infinite;
    }
    @keyframes mic-pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(255, 107, 138, 0.5); }
      50%      { box-shadow: 0 0 0 8px rgba(255, 107, 138, 0); }
    }

    /* History drawer --------------------------------------- */
    .history {
      position: fixed;
      top: 0;
      right: 0;
      width: 400px;
      max-width: 100vw;
      height: 100vh;
      background: rgba(10, 12, 28, 0.92);
      border-left: 1px solid var(--glass-border);
      backdrop-filter: blur(18px);
      transform: translateX(100%);
      transition: transform 0.3s ease;
      z-index: 50;
      display: flex;
      flex-direction: column;
    }
    .history.open { transform: translateX(0); }
    .history-header {
      padding: 22px 24px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--glass-border);
    }
    .history-title {
      font-weight: 600;
      letter-spacing: 1.5px;
      font-size: 13px;
      text-transform: uppercase;
      color: var(--muted);
    }
    .history-list {
      flex: 1;
      overflow-y: auto;
      padding: 18px 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .msg {
      max-width: 90%;
      padding: 11px 14px;
      border-radius: 12px;
      line-height: 1.45;
      font-size: 14px;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    .msg.user {
      align-self: flex-end;
      background: rgba(108, 142, 255, 0.18);
      border: 1px solid rgba(108, 142, 255, 0.3);
      border-bottom-right-radius: 4px;
    }
    .msg.bot {
      align-self: flex-start;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-bottom-left-radius: 4px;
    }
    .msg-who {
      font-size: 10px;
      letter-spacing: 1.5px;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .history-empty {
      color: var(--muted);
      font-size: 13px;
      text-align: center;
      margin-top: 24px;
      font-style: italic;
    }

    /* Toasts ----------------------------------------------- */
    #toasts {
      position: fixed;
      top: 20px;
      right: 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 100;
      pointer-events: none;
    }
    .toast {
      background: var(--glass);
      backdrop-filter: blur(14px);
      border: 1px solid var(--glass-border);
      border-radius: 10px;
      padding: 10px 16px;
      font-size: 13px;
      max-width: 320px;
      animation: toast-in 0.25s ease;
    }
    @keyframes toast-in {
      from { opacity: 0; transform: translateY(-10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Wake word indicator on header */
    .wake-status {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      background: var(--glass);
      backdrop-filter: blur(10px);
      border: 1px solid var(--glass-border);
      border-radius: 10px;
      font-family: "JetBrains Mono", monospace;
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 1px;
    }
    .wake-status.on { color: var(--accent-3); border-color: rgba(79, 209, 255, 0.4); }
    .wake-status.off { color: var(--muted); }

    @media (max-width: 720px) {
      header { padding: 16px 18px; gap: 8px; }
      .brand-sub, .conn-label { display: none; }
      #orb-stage { width: 280px; height: 280px; }
      .orb { width: 160px; height: 160px; }
      .ring-3 { display: none; }
      .input-bar { padding: 12px 16px 20px; }
      .last-line { font-size: 16px; }
      .history { width: 100vw; }
    }
  </style>
</head>
<body>
  <div id="app">
    <header>
      <div class="brand">
        <div class="brand-logo">C</div>
        <div>
          <div class="brand-name">CHAPPIE
            <span class="brand-sub">v2.0</span>
          </div>
        </div>
      </div>
      <div class="header-spacer"></div>
      <div class="conn">
        <span class="conn-dot" id="connDot"></span>
        <span class="conn-label" id="connLabel">connecting</span>
      </div>
      <div class="wake-status" id="wakeStatus">
        wake: <span id="wakeText">off</span>
      </div>
      <div class="header-actions">
        <button class="icon-btn active" id="wakeBtn" title="Toggle wake word listening">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
        </button>
        <button class="icon-btn" id="historyBtn" title="History">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
      </div>
    </header>

    <main>
      <div id="orb-stage">
        <div id="orb" class="orb idle orb-clickable" title="Click or say 'hey chappie'">
          <div class="orb-ring ring-3"></div>
          <div class="orb-ring ring-2"></div>
          <div class="orb-ring ring-1"></div>
          <div class="orb-core"></div>
        </div>
      </div>
      <div class="status-area">
        <div class="status-line" id="statusLine">initializing</div>
        <div class="last-line" id="lastResponse"></div>
        <div class="user-line" id="lastTranscript"></div>
      </div>
    </main>

    <div class="input-bar">
      <div class="input-wrap">
        <input id="textInput" type="text" placeholder='Type, or say "hey chappie"...' autocomplete="off" />
        <button class="mic-btn" id="micBtn" title="Click to talk">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
        </button>
      </div>
      <button class="send-btn" id="sendBtn">Send</button>
    </div>
  </div>

  <aside class="history" id="history">
    <div class="history-header">
      <div class="history-title">Conversation</div>
      <button class="icon-btn" id="closeHistoryBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="history-list" id="historyList">
      <div class="history-empty">Nothing yet. Say something to start.</div>
    </div>
  </aside>

  <div id="toasts"></div>

  <script>
    /* =====================================================================
       CHAPPIE voice frontend — wake word + STT + TTS + state machine.
       Browser-native APIs: SpeechRecognition for STT, speechSynthesis for TTS.
       ===================================================================== */

    // -------- DOM refs --------
    const orb            = document.getElementById("orb");
    const statusLine     = document.getElementById("statusLine");
    const lastResponse   = document.getElementById("lastResponse");
    const lastTranscript = document.getElementById("lastTranscript");
    const textInput      = document.getElementById("textInput");
    const sendBtn        = document.getElementById("sendBtn");
    const micBtn         = document.getElementById("micBtn");
    const wakeBtn        = document.getElementById("wakeBtn");
    const wakeStatus     = document.getElementById("wakeStatus");
    const wakeText       = document.getElementById("wakeText");
    const historyBtn     = document.getElementById("historyBtn");
    const closeHistoryBtn= document.getElementById("closeHistoryBtn");
    const historyEl      = document.getElementById("history");
    const historyList    = document.getElementById("historyList");
    const connDot        = document.getElementById("connDot");
    const connLabel      = document.getElementById("connLabel");

    // -------- State --------
    const STATE = {
      IDLE:           "idle",
      LISTENING:      "listening",   // active utterance after wake
      THINKING:       "thinking",
      SPEAKING:       "speaking",
      ERROR:          "error",
    };
    let state          = STATE.IDLE;
    let wakeEnabled    = true;
    let recogActive    = false;
    let activeAfterWake= false;        // we've heard the wake word, listening for the request
    let lastFinalChunk = "";            // dedupe successive final results

    // Wake-word matcher. Be a little fuzzy — STT often hears "chappy" / "chappie" / "chap".
    const WAKE_RX = /\b(?:hey\s+|hi\s+|ok(?:ay)?\s+|yo\s+)?(chap(?:p[iey]+|ie|py|pee|y)?|j(?:arvis|ar v[ie]s))\b/i;

    function isWakePhrase(text) {
      const t = (text || "").trim();
      if (!t) return null;
      const m = t.match(WAKE_RX);
      if (!m) return null;
      // Return everything AFTER the wake match (could be empty)
      return t.slice(m.index + m[0].length).replace(/^[\s,!.?:;]+/, "").trim();
    }

    function setState(next) {
      state = next;
      orb.className = `orb orb-clickable ${next}`;
      statusLine.className = "status-line";
      switch (next) {
        case STATE.IDLE:
          statusLine.textContent = wakeEnabled
            ? 'say "hey chappie" or click the orb'
            : "press the mic or click the orb";
          break;
        case STATE.LISTENING:
          statusLine.textContent = "listening";
          statusLine.classList.add("active");
          break;
        case STATE.THINKING:
          statusLine.textContent = "thinking";
          statusLine.classList.add("thinking");
          break;
        case STATE.SPEAKING:
          statusLine.textContent = "speaking";
          statusLine.classList.add("speaking");
          break;
        case STATE.ERROR:
          statusLine.classList.add("error");
          break;
      }
    }

    function showResponse(text) {
      lastResponse.textContent = text;
    }
    function showTranscript(text) {
      lastTranscript.textContent = text ? `"${text}"` : "";
    }
    function setStatus(text, cls) {
      statusLine.textContent = text;
      statusLine.className = "status-line";
      if (cls) statusLine.classList.add(cls);
    }
    function toast(text, ms = 2400) {
      const el = document.createElement("div");
      el.className = "toast";
      el.textContent = text;
      document.getElementById("toasts").appendChild(el);
      setTimeout(() => { el.style.opacity = "0"; el.style.transition = "opacity 0.3s"; }, ms - 300);
      setTimeout(() => el.remove(), ms);
    }

    function appendHistory(text, who) {
      const empty = historyList.querySelector(".history-empty");
      if (empty) empty.remove();
      const wrap = document.createElement("div");
      wrap.className = "msg " + who;
      const w = document.createElement("div");
      w.className = "msg-who";
      w.textContent = who === "user" ? "you" : "chappie";
      const body = document.createElement("div");
      body.textContent = text;
      wrap.appendChild(w);
      wrap.appendChild(body);
      historyList.appendChild(wrap);
      historyList.scrollTop = historyList.scrollHeight;
    }

    // -------- WebSocket --------
    let ws = null;
    function connect() {
      const proto = location.protocol === "https:" ? "wss" : "ws";
      ws = new WebSocket(`${proto}://${location.host}/ws`);
      ws.onopen = () => {
        connDot.classList.add("ok");
        connLabel.textContent = "online";
      };
      ws.onclose = () => {
        connDot.classList.remove("ok");
        connLabel.textContent = "reconnecting";
        setTimeout(connect, 1500);
      };
      ws.onerror = () => {};
      ws.onmessage = (ev) => {
        try {
          const data = JSON.parse(ev.data);
          if (data.type === "response") {
            showResponse(data.text);
            appendHistory(data.text, "bot");
            speak(data.text);
          } else if (data.type === "error") {
            setState(STATE.ERROR);
            showResponse("Error: " + data.message);
            setTimeout(() => setState(STATE.IDLE), 2000);
          }
        } catch (e) {
          console.error(e);
        }
      };
    }

    function send(text) {
      if (!text) return;
      appendHistory(text, "user");
      showTranscript(text);
      showResponse("");
      setState(STATE.THINKING);
      if (!ws || ws.readyState !== 1) {
        toast("Not connected — retrying");
        setTimeout(() => setState(STATE.IDLE), 1200);
        return;
      }
      ws.send(JSON.stringify({ type: "text_input", text }));
    }

    // -------- TTS --------
    let voiceCache = null;
    function pickVoice() {
      if (voiceCache) return voiceCache;
      const voices = speechSynthesis.getVoices();
      if (!voices.length) return null;
      const prefs = [
        /Daniel/i,
        /Google UK English Male/i,
        /Microsoft (Mark|David|George|Ryan)/i,
        /UK English|en-GB/i,
        /^en/i,
      ];
      for (const re of prefs) {
        const found = voices.find(v => re.test(v.name) || re.test(v.lang));
        if (found) { voiceCache = found; return found; }
      }
      voiceCache = voices[0];
      return voiceCache;
    }
    if ("speechSynthesis" in window) {
      // Voices load asynchronously
      speechSynthesis.onvoiceschanged = () => { voiceCache = null; pickVoice(); };
    }

    function speak(text) {
      if (!("speechSynthesis" in window) || !text) {
        setState(STATE.IDLE);
        return;
      }
      const utt = new SpeechSynthesisUtterance(text);
      const v = pickVoice();
      if (v) utt.voice = v;
      utt.rate = 1.02;
      utt.pitch = 0.95;
      utt.volume = 1;

      // Pause STT while speaking to avoid feedback loops
      stopRecognition();

      utt.onstart = () => setState(STATE.SPEAKING);
      utt.onend = () => {
        setState(STATE.IDLE);
        if (wakeEnabled) startRecognition();
      };
      utt.onerror = () => {
        setState(STATE.IDLE);
        if (wakeEnabled) startRecognition();
      };

      speechSynthesis.cancel();
      speechSynthesis.speak(utt);
    }

    // -------- STT --------
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recog = null;
    function buildRecognizer() {
      if (!SR) return null;
      const r = new SR();
      r.continuous = true;
      r.interimResults = true;
      r.lang = "en-US";
      r.onstart = () => { recogActive = true; };
      r.onend = () => {
        recogActive = false;
        // Auto-restart while wake mode is on and we're not speaking.
        if (wakeEnabled && state !== STATE.SPEAKING && state !== STATE.THINKING) {
          // Tiny delay to avoid tight loops on errors
          setTimeout(() => { if (wakeEnabled) startRecognition(); }, 250);
        }
      };
      r.onerror = (ev) => {
        if (ev.error === "not-allowed" || ev.error === "service-not-allowed") {
          toast("Mic access denied. Click the lock icon and allow mic, then refresh.", 4500);
          setWakeEnabled(false);
          return;
        }
        // Normal — "no-speech", "aborted" — onend will restart.
      };
      r.onresult = (ev) => {
        let interim = "";
        let final = "";
        for (let i = ev.resultIndex; i < ev.results.length; i++) {
          const res = ev.results[i];
          if (res.isFinal) final += res[0].transcript;
          else              interim += res[0].transcript;
        }
        // Show what we hear in real-time
        const live = (final + " " + interim).trim();
        if (live && state !== STATE.SPEAKING) showTranscript(live);

        if (final) {
          handleFinalUtterance(final.trim());
        }
      };
      return r;
    }

    function handleFinalUtterance(text) {
      if (!text || text === lastFinalChunk) return;
      lastFinalChunk = text;

      // If we already heard the wake word and were waiting for a request,
      // treat THIS utterance as the request.
      if (activeAfterWake) {
        activeAfterWake = false;
        send(text);
        return;
      }

      // Otherwise, see if this utterance contains a wake phrase.
      const after = isWakePhrase(text);
      if (after === null) return;  // no wake word, ignore

      if (after) {
        // "Hey chappie open chrome" — full request in one breath
        send(after);
      } else {
        // Just "hey chappie" — wait for the next utterance
        activeAfterWake = true;
        setState(STATE.LISTENING);
        showTranscript("");
        showResponse('Yes?');
      }
    }

    function startRecognition() {
      if (!SR) return;
      if (!recog) recog = buildRecognizer();
      if (!recog) return;
      if (recogActive) return;
      try {
        recog.start();
      } catch (e) {
        // Common: "InvalidStateError" if already started; safe to ignore.
      }
    }
    function stopRecognition() {
      if (recog && recogActive) {
        try { recog.stop(); } catch (e) {}
      }
    }

    function setWakeEnabled(on) {
      wakeEnabled = !!on;
      wakeBtn.classList.toggle("active", wakeEnabled);
      wakeStatus.classList.toggle("on", wakeEnabled);
      wakeStatus.classList.toggle("off", !wakeEnabled);
      wakeText.textContent = wakeEnabled ? "on" : "off";
      if (wakeEnabled) {
        if (state === STATE.IDLE) startRecognition();
      } else {
        stopRecognition();
        activeAfterWake = false;
        if (state === STATE.IDLE) setStatus('press the mic or click the orb');
      }
    }

    // -------- Manual mic button (push-to-talk) --------
    let manualRecording = false;
    function toggleManual() {
      if (manualRecording) {
        stopRecognition();
        manualRecording = false;
        micBtn.classList.remove("recording");
        if (state === STATE.LISTENING) setState(STATE.IDLE);
        return;
      }
      manualRecording = true;
      activeAfterWake = true;  // any final utterance becomes a request
      setState(STATE.LISTENING);
      micBtn.classList.add("recording");
      showResponse("");
      startRecognition();
    }

    // -------- Click the orb to talk --------
    orb.addEventListener("click", () => {
      if (state === STATE.SPEAKING) {
        speechSynthesis.cancel();
        setState(STATE.IDLE);
        return;
      }
      toggleManual();
    });

    // -------- Wire UI --------
    sendBtn.addEventListener("click", () => {
      const t = textInput.value.trim();
      if (!t) return;
      send(t);
      textInput.value = "";
    });
    textInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendBtn.click();
      }
    });
    micBtn.addEventListener("click", (e) => { e.stopPropagation(); toggleManual(); });
    wakeBtn.addEventListener("click", () => setWakeEnabled(!wakeEnabled));
    historyBtn.addEventListener("click", () => historyEl.classList.add("open"));
    closeHistoryBtn.addEventListener("click", () => historyEl.classList.remove("open"));

    // -------- Boot --------
    window.addEventListener("load", () => {
      connect();
      if (!SR) {
        toast("Voice listening isn't supported in this browser. Try Chrome or Edge.", 4500);
        setWakeEnabled(false);
      } else {
        // Don't auto-start until the user interacts (browsers gate mic on user gesture).
        setWakeEnabled(true);
        // Many browsers will prompt on first start(). Try once silently;
        // if denied, the error handler will turn wake off.
        startRecognition();
      }
      setState(STATE.IDLE);
      showResponse("Hi. I'm CHAPPIE.");
    });
  </script>
</body>
</html>
